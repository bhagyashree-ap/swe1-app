language: python
python:
  - "3.12"

install:
  - python -m pip install --upgrade pip
  - pip install -r requirements.txt

script:
  - black --check .
  - flake8 .
  - coverage run --source=polls manage.py test

after_success:
  - COVERALLS_GIT_BRANCH="$TRAVIS_BRANCH" coveralls

deploy:
  provider: elasticbeanstalk
  access_key_id: "$AWS_ACCESS_KEY_ID"
  secret_access_key: "$AWS_SECRET_ACCESS_KEY"
  region: us-west-2
  app: swe1-app
  env: pollapp-env
  bucket: elasticbeanstalk-us-west-2-764565585211
  wait_until_deployed: true
  edge: true
  on:
    branch: main
    repo: bhagyashree-ap/swe1-app
