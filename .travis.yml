language: python
python:
  - "3.12"

services:
  - postgresql

addons:
  postgresql: "15"

install:
  - python -m pip install --upgrade pip
  - pip install -r requirements.txt

before_script:
  - sudo service postgresql start
  - for attempt in $(seq 1 30); do pg_isready -h 127.0.0.1 -p 5432 -U postgres && break; sleep 1; done
  - pg_isready -h 127.0.0.1 -p 5432 -U postgres

env:
  - DATABASE_URL=postgres://postgres@127.0.0.1:5432/postgres

script:
  - black --check .
  - flake8 .
  - coverage run --source=polls manage.py test

after_success:
  - coveralls

deploy:
  provider: elasticbeanstalk
  access_key_id: "$AWS_ACCESS_KEY_ID"
  secret_access_key: "$AWS_SECRET_ACCESS_KEY"
  region: "$AWS_DEFAULT_REGION"
  app: "$EB_APPLICATION_NAME"
  env: "$EB_ENVIRONMENT_NAME"
  bucket: "$EB_S3_BUCKET"
  edge: true
  on:
    branch: main
    repo: bhagyashree-ap/swe1-app
